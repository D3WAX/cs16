name: Android CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}

concurrency:
  group: "android-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Urutan patch: semuanya aman dijalankan berkali-ka
      - name: Install client_aim (client-only)
        run: python3 scripts/install_client_aim.py

      - name: Install chams (client-only)
        run: python3 scripts/install_chams.py

      - name: Install nojs
        run: python3 scripts/install_nojs.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleGitDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xarph-debug-apk
          path: android/app/build/outputs/apk/git/debug/app-git-debug.apk
          if-no-files-found: error
          retention-days: 7
          
